version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:${PORT:-8000}
    depends_on:
      - backend
    restart: unless-stopped
